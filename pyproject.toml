[project]
name = "retail-workbench"
version = "0.1.0"
description = "Auditable retail CSV cleaning and grounded analytical chat"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
